# slurm.conf for mini-hpc-ai-cluster. One line of reason per non-default setting.
# Identical on every node; mounted read-only at /config/slurm and copied at boot.

ClusterName=minihpc
SlurmctldHost=head
SlurmUser=slurm
SlurmctldPort=6817
SlurmdPort=6818
AuthType=auth/munge
CredType=cred/munge
MailProg=/bin/true

StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurm/slurmctld.pid
SlurmdPidFile=/run/slurm/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
# info: enough for the runbook to quote, not so much that the logs hide the line
SlurmctldDebug=info
SlurmdDebug=info

# Cores and memory are consumable: a job gets what it asked for and no more.
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
SchedulerType=sched/backfill
EnforcePartLimits=ALL

# cgroup v2 tracks and confines every step (see cgroup.conf and docs/DECISIONS.md).
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup
PrologFlags=Contain
JobAcctGatherType=jobacct_gather/cgroup
JobAcctGatherFrequency=30

# The containers report the host CPU count and memory; the values below are the
# limits Docker enforces on each container, so slurm.conf is the source of truth.
SlurmdParameters=config_overrides
ReturnToService=1

# Accounting: sacct, sshare, sprio and the limits need slurmdbd.
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=head
AccountingStorageEnforce=associations,limits,qos

# Fair share must be visible in a test with two users on the same day.
PriorityType=priority/multifactor
PriorityWeightFairshare=10000
PriorityWeightAge=1000
PriorityWeightQOS=5000
PriorityDecayHalfLife=1-0

# Time-limit test must be visible: 30 s grace, no over-time allowance.
KillWait=30
OverTimeLimit=0
InactiveLimit=0
MinJobAge=300
Waittime=0
MpiDefault=none

# Memory: 900 MB per CPU by default so --mem requests are honest on a 1800 MB node.
DefMemPerCPU=900

# Generic resources: the one GPU on g1 (see gres.conf on that node).
GresTypes=gpu

# Nodes. CPUs and memory match the Docker limits in compose.yaml.
NodeName=c1 NodeAddr=c1 CPUs=2 RealMemory=1800 State=UNKNOWN
NodeName=c2 NodeAddr=c2 CPUs=2 RealMemory=1800 State=UNKNOWN
NodeName=g1 NodeAddr=g1 CPUs=2 RealMemory=1800 Gres=gpu:p2000:1 State=UNKNOWN

# Partitions: the shapes every site has.
PartitionName=cpu   Nodes=c1,c2 Default=YES MaxTime=2:00:00 State=UP
PartitionName=debug Nodes=c1    MaxTime=10:00 PriorityTier=10 State=UP
PartitionName=gpu   Nodes=g1    MaxTime=4:00:00 State=UP
