# Generic resources on the GPU node g1. One real GPU, the Quadro P2000.
# On WSL2 the GPU is exposed through /dev/dxg (the DirectX kernel device), not
# /dev/nvidia0 as on a bare-metal driver; nvidia-smi and CUDA still work through
# it. slurmd needs a device file that exists, so File points at /dev/dxg.
# Installed only on g1.
Name=gpu Type=p2000 File=/dev/dxg
