# slurmdbd on the head node, MariaDB in the db container.
# The database password is a throwaway for this local test cluster. It is the
# same string as MARIADB_PASSWORD in compose.yaml and protects nothing.
AuthType=auth/munge
DbdHost=head
DbdPort=6819
SlurmUser=slurm
DebugLevel=info
LogFile=/var/log/slurm/slurmdbd.log
PidFile=/run/slurm/slurmdbd.pid
StorageType=accounting_storage/mysql
StorageHost=db
StoragePort=3306
StorageUser=slurm
StoragePass=slurm-throwaway
StorageLoc=slurm_acct_db
