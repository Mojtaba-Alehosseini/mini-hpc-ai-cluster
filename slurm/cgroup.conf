# cgroup v2 inside privileged containers without systemd.
# IgnoreSystemd makes slurmd build its own cgroup subtree instead of asking
# systemd for a scope. The container runtime already limits each node's
# cores and memory; these settings confine each job step within that.
CgroupPlugin=cgroup/v2
IgnoreSystemd=yes
ConstrainCores=yes
ConstrainRAMSpace=yes
ConstrainSwapSpace=yes
ConstrainDevices=no
