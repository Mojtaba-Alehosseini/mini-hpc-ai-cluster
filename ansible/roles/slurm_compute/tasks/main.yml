---
# Compute nodes: the same slurm.conf and cgroup.conf as the head, plus slurmd.
# The cgroup v2 delegation that slurmd needs is done by the container entrypoint
# at start, because it must happen in the init process; here we only place the
# configuration and start the daemon.

- name: Install slurm.conf
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../slurm/slurm.conf"
    dest: /etc/slurm/slurm.conf
    owner: slurm
    group: slurm
    mode: "0644"
  notify: restart slurmd

- name: Install cgroup.conf
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../slurm/cgroup.conf"
    dest: /etc/slurm/cgroup.conf
    owner: slurm
    group: slurm
    mode: "0644"
  notify: restart slurmd

- name: Install gres.conf on GPU nodes
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../slurm/gres.conf"
    dest: /etc/slurm/gres.conf
    owner: slurm
    group: slurm
    mode: "0644"
  when: inventory_hostname in groups['gpu']
  notify: restart slurmd

- name: Apply any restart now
  ansible.builtin.meta: flush_handlers

- name: slurmd is running
  ansible.builtin.command: supervisorctl start slurmd
  register: slurmd_start
  changed_when: "'started' in slurmd_start.stdout and 'already' not in slurmd_start.stdout"
  failed_when: >
    slurmd_start.rc != 0 and
    'already started' not in slurmd_start.stdout
