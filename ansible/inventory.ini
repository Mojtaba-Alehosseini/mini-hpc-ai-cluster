# Nodes are containers in the "minihpc" compose project. Ansible reaches them
# with the docker connection plugin, which runs "docker exec" instead of ssh.
# The gpu, nfs and monitoring groups fill in on the later build days.

[head]
headnode ansible_host=minihpc-head-1

[compute]
c1 ansible_host=minihpc-c1-1
c2 ansible_host=minihpc-c2-1
g1 ansible_host=minihpc-g1-1

# db is the mariadb image with no python, so it is not an Ansible target; the
# slurm_db role runs on head and only talks to the database over the network.
[db]

[gpu]
g1 ansible_host=minihpc-g1-1

[nfs]
nfsserver ansible_host=minihpc-nfs-1

[monitoring]

[cluster:children]
head
compute

[all:vars]
ansible_connection=community.docker.docker
ansible_user=root
ansible_python_interpreter=/usr/bin/python3
