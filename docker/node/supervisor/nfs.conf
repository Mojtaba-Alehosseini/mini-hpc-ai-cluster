; NFS server node: rpcbind and rpc.mountd in the foreground. The kernel NFS
; threads are started by rpc.nfsd (a one-shot, done by the nfs_server role), so
; they are not a supervised process. autostart is off; Ansible starts these once
; /etc/exports is written. NFSv4 only, so no statd or lockd.
[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid
user=root

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:rpcbind]
command=/usr/sbin/rpcbind -f -w
priority=10
autostart=false
autorestart=true
startretries=10
stdout_logfile=/var/log/nfs-rpcbind.out
stderr_logfile=/var/log/nfs-rpcbind.err

[program:mountd]
command=/usr/sbin/rpc.mountd -F --no-nfs-version 3
priority=20
autostart=false
autorestart=true
startretries=10
stdout_logfile=/var/log/nfs-mountd.out
stderr_logfile=/var/log/nfs-mountd.err

[program:node-exporter]
command=/usr/bin/prometheus-node-exporter --web.listen-address=:9100
priority=40
autostart=false
autorestart=true
startretries=10
stdout_logfile=/var/log/node-exporter.out
stderr_logfile=/var/log/node-exporter.err
