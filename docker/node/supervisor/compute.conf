; Compute node: munge and slurmd. Foreground, no systemd.
; autostart=false: Ansible starts the daemons once the munge key and the Slurm
; configuration are in place. autorestart keeps a running daemon alive if it
; later crashes. After a host reboot, run "make up" to start them.
[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid
user=root

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:munged]
command=/usr/sbin/munged -F
user=munge
priority=10
autostart=false
autorestart=true
startretries=10
stdout_logfile=/var/log/munge/munged.out
stderr_logfile=/var/log/munge/munged.err

[program:slurmd]
command=/usr/sbin/slurmd -D
user=root
priority=20
autostart=false
autorestart=true
startretries=10
stdout_logfile=/var/log/slurm/slurmd.out
stderr_logfile=/var/log/slurm/slurmd.err
