; Head node: munge, slurmdbd, slurmctld. Foreground, no systemd.
; The daemons start with autostart=false: Ansible starts them once it has placed
; the munge key and the Slurm configuration. autorestart keeps a running daemon
; alive if it later crashes. After a host reboot, run "make up" to start them.
[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid
user=root

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:munged]
command=/usr/sbin/munged -F
user=munge
priority=10
autostart=false
autorestart=true
startretries=10
stdout_logfile=/var/log/munge/munged.out
stderr_logfile=/var/log/munge/munged.err

[program:slurmdbd]
command=/usr/sbin/slurmdbd -D
user=slurm
priority=20
autostart=false
autorestart=true
startretries=10
stdout_logfile=/var/log/slurm/slurmdbd.out
stderr_logfile=/var/log/slurm/slurmdbd.err

[program:slurmctld]
command=/usr/sbin/slurmctld -D
user=slurm
priority=30
autostart=false
autorestart=true
startretries=10
stdout_logfile=/var/log/slurm/slurmctld.out
stderr_logfile=/var/log/slurm/slurmctld.err

[program:node-exporter]
command=/usr/bin/prometheus-node-exporter --web.listen-address=:9100
priority=40
autostart=false
autorestart=true
startretries=10
stdout_logfile=/var/log/node-exporter.out
stderr_logfile=/var/log/node-exporter.err

[program:slurm-exporter]
command=/usr/bin/python3 /opt/exporters/slurm_exporter.py
priority=50
autostart=false
autorestart=true
startretries=20
stdout_logfile=/var/log/slurm-exporter.out
stderr_logfile=/var/log/slurm-exporter.err
