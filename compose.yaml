# mini-hpc-ai-cluster: one compose project, one bridge network.
# Current shape: nfs (NFS server), db (MariaDB), head (slurmctld, slurmdbd),
# c1, c2 (slurmd). Ansible configures the nodes and mounts /shared over NFS
# after they start (see ansible/ and the Makefile). Node g1 and the monitoring
# stack are added later.
name: minihpc

services:
  db:
    image: mariadb:10.11
    hostname: db
    restart: unless-stopped
    environment:
      # Throwaway passwords for a local test database. They protect nothing.
      MARIADB_ROOT_PASSWORD: root-throwaway
      MARIADB_DATABASE: slurm_acct_db
      MARIADB_USER: slurm
      MARIADB_PASSWORD: slurm-throwaway
    command: --innodb-buffer-pool-size=1G --innodb-lock-wait-timeout=900 --innodb-log-file-size=64M
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 40
    networks: [cluster]

  nfs:
    build: docker/node
    image: minihpc/node:23.11
    hostname: nfs
    restart: unless-stopped
    environment:
      NODE_ROLE: nfs
    # privileged: the kernel NFS server needs to load exports and serve rpc.
    privileged: true
    volumes:
      # the export is on this named volume (real ext4); the kernel NFS server
      # cannot export the container's overlay filesystem.
      - shared:/exports
    networks: [cluster]

  head:
    image: minihpc/node:23.11
    hostname: head
    restart: unless-stopped
    environment:
      NODE_ROLE: head
    # privileged: mounts /shared over NFS.
    privileged: true
    depends_on:
      db:
        condition: service_healthy
      nfs:
        condition: service_started
    networks: [cluster]

  c1:
    image: minihpc/node:23.11
    hostname: c1
    restart: unless-stopped
    environment:
      NODE_ROLE: compute
    # privileged: slurmd manages cgroups for job steps and mounts /shared over NFS.
    privileged: true
    cpuset: "0,1"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    volumes:
      # node-local disk for the IO benchmark: /local (ext4 volume) versus
      # /shared (NFS). Only c1 has it; the benchmarks run from c1.
      - scratch:/local
    depends_on:
      head:
        condition: service_started
      nfs:
        condition: service_started
    networks: [cluster]

  c2:
    image: minihpc/node:23.11
    hostname: c2
    restart: unless-stopped
    environment:
      NODE_ROLE: compute
    privileged: true
    cpuset: "2,3"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    depends_on:
      head:
        condition: service_started
      nfs:
        condition: service_started
    networks: [cluster]

  g1:
    image: minihpc/node:23.11
    hostname: g1
    restart: unless-stopped
    environment:
      NODE_ROLE: compute
      # inject nvidia-smi and the compute libraries into the container.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    # privileged + seccomp unconfined: slurmd cgroups, NFS mount, and Apptainer
    # (which needs unprivileged user namespaces) inside the container.
    privileged: true
    security_opt:
      - seccomp=unconfined
    cpuset: "4,5"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          # the Quadro P2000, passed in by the NVIDIA container runtime; it
          # appears as /dev/nvidia0, which gres.conf points at.
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      head:
        condition: service_started
      nfs:
        condition: service_started
    networks: [cluster]

  prometheus:
    image: prom/prometheus:v2.54.1
    hostname: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"   # open http://localhost:9090 on the host
    networks: [cluster]

  grafana:
    image: grafana/grafana:11.2.0
    hostname: grafana
    restart: unless-stopped
    environment:
      # throwaway local credentials; this Grafana is not exposed off the laptop
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin-throwaway
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"   # open http://localhost:3000 on the host (admin / admin-throwaway)
    depends_on:
      prometheus:
        condition: service_started
    networks: [cluster]

volumes:
  dbdata:
  # backing store for the NFS export, mounted at /exports on the nfs node.
  shared:
  # node-local disk on c1 for the IO benchmark comparison.
  scratch:
  promdata:
  grafanadata:

networks:
  cluster:
    name: cluster
